# Host nginx routing for the test copies. Installed at
# /etc/nginx/sites-available/cse312-test-copies, then HTTPS and the port 80
# redirect are added on the server with:
#   certbot --nginx --cert-name cse312-test-copies --redirect \
#     -d test1.cse312-horrorslop.com -d test2.cse312-horrorslop.com

map $http_upgrade $cse312_connection_upgrade {
    default upgrade;
    ''      close;
}

# Browsers send this header and most scanners don't. Only browser visits go in
# the log that deploy/stop-idle-tests.sh reads, so bots can't keep a copy awake.
map $http_sec_fetch_site $cse312_is_browser {
    ''      0;
    default 1;
}

server {
    listen 80;
    server_name test1.cse312-horrorslop.com;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/test-1.browser.log combined if=$cse312_is_browser;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cse312_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 80;
    server_name test2.cse312-horrorslop.com;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/test-2.browser.log combined if=$cse312_is_browser;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cse312_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
