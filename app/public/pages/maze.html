<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Maze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="maze">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="info">
      <div id="me" class="name"></div>
      <div class="tags"><span id="lvl" class="tag">floor 1</span><span id="lives" class="tag dim"></span></div>
      <div id="team"></div>
    </div>
    <div id="clock">5:00</div>
    <div id="caption"></div>
    <div id="sub"></div>
    <div id="board"></div>
    <div id="spec" class="hidden"></div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="debugpanel" class="hidden"></div>
    <div id="controls"><kbd>WASD</kbd> move <kbd>E</kbd> pull lever</div>
  </div>

  <div id="title" class="screen comic fit">
    <div class="fit-inner">
      <div class="splash small">
        <div class="ribbon yellow">Stage 2 · The maze</div>
        <h1 class="logo"><span>THE</span><span>MAZE</span></h1>
        <p id="intro-text" class="sticker">Connecting…</p>
      </div>
      <div id="intro-teams" class="team-list"></div>
      <div class="cards" id="howto"></div>
      <div class="cta">
        <button id="start" class="btn"><span>Play</span></button>
        <p class="keys" id="intro-keys"><kbd>WASD</kbd> move <kbd>E</kbd> pull <kbd>WHEEL</kbd> zoom</p>
      </div>
    </div>
  </div>

  <div id="over" class="screen comic hidden">
    <div class="splash small">
      <div class="burst"><h1 class="logo" id="over-title">TIME!</h1></div>
      <p id="over-text" class="sticker"></p>
    </div>
    <div id="board-final"></div>
    <div class="cta"><p class="keys" id="again-count"></p></div>
  </div>

  <div id="lost" class="screen comic hidden">
    <div class="splash small">
      <h1 class="logo"><span>BYE</span></h1>
      <p class="sticker">You opened the game in another tab.</p>
    </div>
    <div class="cta"><a class="btn" href="/"><span>Home</span></a></div>
  </div>

  <script src="/static/assets/manifest.js"></script>
  <script src="/static/art.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/shared/mazeworld.js"></script>
  <script src="/static/js/net.js"></script>
  <script src="/static/js/howto-maze.js"></script>
  <script src="/static/js/maze.js"></script>
</body>
</html>
