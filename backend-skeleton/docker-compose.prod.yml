# Server-only settings, layered over docker-compose.yml by the deploy script.
services:
  nginx:
    # only the server's own nginx (which adds HTTPS) may reach the app; nothing else from outside
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"
    restart: always
  auth:
    restart: always
  app:
    restart: always
  db:
    restart: always
