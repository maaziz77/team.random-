# Host nginx for the live site, cse312-horrorslop.com. Installed at
# /etc/nginx/sites-available/cse312-horrorslop.com (a copy of the file on the server).
# HTTPS ends here and everything is proxied to the app's Docker stack on 127.0.0.1:8080,
# including the game's WebSocket (wss://). $cse312_connection_upgrade is defined in
# test-copies.conf. The certificate and the port 80 redirect were added with certbot.
# After editing on the server: sudo nginx -t && sudo systemctl reload nginx

server {
    server_name cse312-horrorslop.com www.cse312-horrorslop.com;
    server_tokens off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;          # HTTPS ends here; the app needs to know
        proxy_set_header Upgrade $http_upgrade;            # the game's WebSocket (wss://)
        proxy_set_header Connection $cse312_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cse312-horrorslop.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cse312-horrorslop.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.cse312-horrorslop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = cse312-horrorslop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cse312-horrorslop.com www.cse312-horrorslop.com;
    return 404; # managed by Certbot

}